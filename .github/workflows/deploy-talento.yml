name: 🚀 Deploy Talento - Batidos Pitaya

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🔑 Configurar SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
        
    - name: 📤 Sincronizar archivos (rsync)
      run: |
        echo "🔄 Sincronizando archivos v13..."
        
        rsync -avz \
          --delete \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='.gitignore' \
          --exclude='.agent/' \
          --exclude='.scripts/' \
          --exclude='uploads/' \
          -e "ssh -o StrictHostKeyChecking=no -p 65002" \
          ./ \
          ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH_TALENTO }}/
          
    - name: 🔧 Configurar permisos (v13)
      run: |
        echo "🔧 Configurando permisos en el servidor..."
        
        ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} << 'EOF'
          cd ${{ secrets.HOSTINGER_PATH_TALENTO }}
          # Directorios a 755 (ajustado para incluir core y docs)
          find . -maxdepth 1 -type d ! -path "." -exec chmod 755 {} \;
          find core docs ajax assets css js -type d -exec chmod 755 {} \; 2>/dev/null || true
          
          # Archivos a 644
          find . -maxdepth 1 -type f -exec chmod 644 {} \;
          find core docs ajax assets css js -type f -exec chmod 644 {} \; 2>/dev/null || true
          
          echo "✅ Permisos actualizados para Core y Docs."
        EOF
        
    - name: ✅ Verificar deploy
      run: |
        echo "✅ Deploy completado para talento.batidospitaya.com"
        echo "🌐 Sitio: https://talento.batidospitaya.com"
